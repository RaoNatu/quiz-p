<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GATE 2027 CS · Study Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1124;--p:#171b36;--p2:#1f2447;--tx:#e9ebff;--mu:#9aa0c9;--ac:#ffd166;--ok:#4ade80;--bd:#2b3160;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f4fb;--p:#fff;--p2:#eceefa;--tx:#1a1d3a;--mu:#5d638c;--ac:#c47f00;--ok:#15803d;--bd:#d7daf0;color-scheme:light}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.sora{font-family:Sora,Inter,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1100px;margin:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--p);border:1px solid var(--bd);border-radius:99px;padding:3px 12px;font-size:13px}
nav{display:flex;gap:4px;max-width:1100px;margin:8px auto 0;overflow-x:auto}
nav button{background:none;border:0;color:var(--mu);padding:8px 14px;border-radius:8px;font:500 14px Inter;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--p2);color:var(--tx)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:18px 16px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;border-radius:6px;padding:1px 9px;font-size:12px;font-weight:600;color:#10122a}
.mu{color:var(--mu)}.row{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--p2)}.row input{margin-top:4px;accent-color:var(--ac);width:17px;height:17px;flex:none}
.row.d span{text-decoration:line-through;color:var(--mu)}.tm{font-size:12px;color:var(--mu);min-width:92px;flex:none;padding-top:2px}
.bar{height:8px;background:var(--p2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.btn{background:var(--ac);color:#10122a;border:0;border-radius:10px;padding:9px 16px;font:600 14px Inter;cursor:pointer}
.btn.g{background:var(--p2);color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:12px;color:var(--mu);text-align:center}
.cell{border:1px solid var(--bd);border-radius:9px;padding:5px;min-height:62px;font-size:11px;cursor:pointer;background:var(--p);text-align:left;color:var(--tx);position:relative;overflow:hidden}
.cell b{font-size:13px}.cell .s{position:absolute;left:0;top:0;bottom:0;width:4px}.cell.sel{outline:2px solid var(--ac)}.cell.ok{background:var(--p2)}.cell.ok::after{content:"✓";position:absolute;right:5px;top:3px;color:var(--ok);font-weight:700}
.cell .t{display:block;color:var(--mu);line-height:1.2;margin-top:2px}@media(max-width:600px){.cell .t{display:none}}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
li{margin:3px 0 3px 18px}pre{background:var(--p2);padding:12px;border-radius:10px;overflow:auto;font-size:13px;margin:8px 0}
input[type=text],input[type=search]{background:var(--p2);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:9px 12px;font:15px Inter;width:100%}
.dock{position:fixed;bottom:0;left:0;right:0;background:var(--p);border-top:1px solid var(--bd);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:6}
.dock .big{font:700 24px Sora;min-width:76px;text-align:center}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 14px Sora;flex:none}
.ring span{background:var(--p);width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.pr{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

["AL","Complexity & Recurrences","Asymptotic notation: O, Ω, Θ, o, ω, growth-rate ordering; Analysis: best/worst/average, nested loops; Recurrences: substitution, recursion tree, Master theorem, non-master cases; Space complexity","Growth ordering, loop complexity, recurrence solving"],

["AL","Dynamic Programming","DP method: optimal substructure, overlapping subproblems, memoisation vs tabulation; Classics: 0/1 knapsack, LCS, LIS, matrix-chain, edit distance, coin change; Graph DP: Floyd–Warshall; Table filling and counting subproblems","DP table values (NAT), recurrence identification"],

else x=c<new Date(2027,0,1)?D[li++]:J[ji++];
P.push({d:c,k:iso(c),s:x[0],t:x[1],tp:x[2].split(";").map(s=>s.trim()),q:x[3]||"Last 10 years PYQs on these topics + NAT drill",n:P.length+1});}
let S={c:{},f:0,nat:[0,0]};try{S=Object.assign(S,JSON.parse(localStorage.getItem("g27")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("g27",JSON.stringify(S))}catch(e){}};
const dp=p=>{let n=0,t=p.tp.length+B.length;for(const k in S.c)if(k.startsWith(p.k+"|"))n++;return n/t};
const t0=iso(new Date());let sel=(P.find(p=>p.k==t0)||(t0<P[0].k?P[0]:P[P.length-1])).k,tab="today",ft="";
const NAV=[["today","Today"],["plan","Plan & progress"],["syl","Syllabus map"],["notes","Obsidian notes"],["nat","NAT practice"]];
const fd=d=>d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
function streak(){let s=0,i=P.findIndex(p=>p.k==t0);if(i<0)i=t0>P[0].k?P.length-1:-1;if(i>=0&&dp(P[i])<.6)i--;for(;i>=0&&dp(P[i])>=.6;i--)s++;return s}
function head(){const xp=Object.keys(S.c).length*10+S.f,i=P.findIndex(p=>p.k==t0),left=Math.max(0,Math.ceil((new Date(2027,0,31)-new Date())/864e5));
$("#chips").innerHTML=`<span class="chip">🔥 ${streak()}-day streak</span><span class="chip">Level ${Math.floor(xp/500)+1} · ${xp} XP</span><span class="chip">${left} days to Jan 31</span>`;
$("#sub").textContent="Plan: 6 Nov 2026 → 31 Jan 2027 · Learn till 31 Dec, PYQs & mocks in Jan · check official GATE dates";
$("#nav").innerHTML=NAV.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
$("#fm").textContent=Math.round(S.f/60*10)/10+" focus hrs logged"}
const go=t=>{tab=t;render();scrollTo(0,0)};
const tg=(k)=>{S.c[k]?delete S.c[k]:S.c[k]=1;save();render()};
function today(){const p=P.find(x=>x.k==sel),i=p.n-1,pc=Math.round(dp(p)*100),m=SUB[p.s];
const hrs=B.reduce((a,b,j)=>a+(S.c[p.k+"|b"+j]?b[2]:0),0);
return `<div class="grid2"><div><div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="ring" style="background:conic-gradient(var(--ok) ${pc*3.6}deg,var(--p2) 0)"><span>${pc}%</span></div><div style="flex:1"><div class="mu">Day ${p.n} of ${P.length} · ${fd(p.d)}</div><h2 style="font-size:20px">${p.t}</h2><span class="tag" style="background:${m[1]}">${m[0]}</span></div></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn g" ${i?"":"disabled"} onclick="sel=P[${i-1}]?.k;render()">← Previous</button><button class="btn g" onclick="sel='${t0>=P[0].k&&t0<=P[P.length-1].k?t0:P[0].k}';render()">Jump to today</button><button class="btn g" ${i<P.length-1?"":"disabled"} onclick="sel=P[${i+1}]?.k;render()">Next →</button></div></div>
<div class="card"><h3>What to study today</h3><p class="mu" style="font-size:13px;margin-bottom:6px">Tick each topic when you can explain it without notes.</p>${p.tp.map((t,j)=>{const k=p.k+"|t"+j,[a,b]=t.split(/:(.*)/s);return `<label class="row ${S.c[k]?"d":""}"><input type="checkbox" ${S.c[k]?"checked":""} onchange="tg('${k}')"><span>${b?`<b>${a}:</b>${b}`:t}</span></label>`}).join("")}</div>
<div class="card"><h3>Most-asked in GATE</h3><p>${p.q}</p></div></div>
<div><div class="card"><h3>Daily timetable <span class="mu" style="font-size:13px">· ${hrs}h of 8.75h study done</span></h3>${B.map((b,j)=>{const k=p.k+"|b"+j;return `<label class="row ${S.c[k]?"d":""}"><input type="checkbox" ${S.c[k]?"checked":""} onchange="tg('${k}')"><span class="tm">${b[0]}</span><span>${b[1]}</span></label>`}).join("")}</div>
<div class="card"><i class="mu">“${Q[i%Q.length]}”</i></div></div></div>`}
function plan(){const f=P[0].d.getDay()||7,subs=Object.keys(SUB).filter(k=>k!="RV"&&k!="MK");
const pr=subs.map(k=>{const l=P.filter(p=>p.s==k);return l.length?`<div class="pr"><span>${SUB[k][0].split(",")[0]}</span><div class="bar"><i style="width:${Math.round(l.reduce((a,p)=>a+dp(p),0)/l.length*100)}%;background:${SUB[k][1]}"></i></div><span>${Math.round(l.reduce((a,p)=>a+dp(p),0)/l.length*100)}%</span></div>`:""}).join("");
let cal=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(f-1),mo="";
P.forEach(p=>{if(p.d.getDate()==1||p.n==1){if(cal)cal+=`<div style="grid-column:1/-1;font:700 15px Sora;margin-top:10px">${p.d.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</div>`;if(p.d.getDate()==1&&p.n>1){cal+="<div></div>".repeat((p.d.getDay()||7)-1)}}
cal+=`<button class="cell ${dp(p)>=.6?"ok":""} ${p.k==sel?"sel":""}" onclick="sel='${p.k}';go('today')"><i class="s" style="background:${SUB[p.s][1]}"></i><b>${p.d.getDate()}</b><span class="t">${p.t}</span></button>`});
return `<div class="card"><h2>Phases</h2><ul><li><b>6 Nov → 31 Dec:</b> learn every syllabus topic once (48 study days, Sundays = weekly test).</li><li><b>1 Jan → 15 Jan:</b> subject-wise PYQs + revision from your notes.</li><li><b>16 Jan → 31 Jan:</b> 5 full mocks, error analysis, rapid revision, rest before the exam.</li></ul></div>
<div class="card"><h3>Subject progress</h3>${pr}</div><div class="card"><h3>Calendar: tap a day to open it</h3><div class="cal">${cal}</div></div>`}
function syl(){const q=(ft||"").toLowerCase();let h=`<div class="card"><h2>Syllabus map</h2><p class="mu">Every syllabus section → topics → subtopics, with the day to study it. Use this instead of the PDF.</p><input type="search" placeholder="Search a topic (e.g. LR parsing, Bayes, TCP)…" value="${ft}" oninput="ft=this.value;render();document.querySelector('input[type=search]').focus()"></div>`;
for(let s=1;s<=10;s++){const ds=P.filter(p=>SUB[p.s][2]==s&&p.s!="RV"&&p.s!="MK");const b=ds.map(p=>{if(q&&!(p.t+p.tp.join()).toLowerCase().includes(q))return"";return `<div style="margin:8px 0"><a href="#" onclick="sel='${p.k}';go('today');return false" style="color:var(--ac)"><b>${fd(p.d)}: ${p.t}</b></a><ul>${p.tp.map(t=>`<li>${t.replace(/^([^:]+):/,"<b>$1:</b>")}</li>`).join("")}</ul></div>`}).join("");if(b)h+=`<details ${q?"open":""}><summary>Section ${s}: ${SEC[s]} <span class="mu">(${ds.length} days)</span></summary>${b}</details>`}
return h}
function notes(){return `<div class="card"><h2>How to make fast, useful notes in Obsidian</h2><p class="mu">Goal: notes you can revise in 10 minutes, not a textbook copy.</p></div>
<div class="grid2"><div class="card"><h3>Vault structure</h3><pre>GATE2027/
 ├─ 00-Inbox/        quick captures
 ├─ 01-Subjects/
 │   ├─ Algorithms/   (one note per topic)
 │   ├─ OS/ DBMS/ CN/ …
 ├─ 02-Cheatsheets/  1 page per subject
 ├─ 03-PYQ-Log/      tricky questions
 ├─ 04-Mistake-Log/  wrong answers + why
 └─ Templates/</pre><h3>Topic template</h3><pre># {{title}}
#gate/{{subject}}
**One-line idea:**
**Key formulas / rules:**
**Standard question types:**
**Trap / common mistake:**
**Example (solved):**
Links: [[Related topic]]</pre></div>
<div class="card"><h3>The 4-step speed method</h3><ol><li><b>Learn:</b> watch or read first, taking no notes.</li><li><b>Write from memory:</b> close the source, write only what you remember (≈10 lines per topic).</li><li><b>Fill gaps:</b> check the source, add what you missed in <code>==highlight==</code>.</li><li><b>Test:</b> turn 3 key points into flashcards: <code>question::answer</code>.</li></ol>
<h3>Rules to stay fast</h3><ul><li>Max 1 page per topic. Use tables and bullet points.</li><li>Link notes with <code>[[ ]]</code>: e.g. [[Master theorem]] ↔ [[Merge sort]].</li><li>Use tags: <code>#gate/algo</code>, <code>#weak</code>, <code>#formula</code>.</li><li>Callouts: <code>&gt; [!warning] trap</code> for exam traps.</li><li>Handwrite diagrams (Excalidraw plugin) for automata, trees, pipelines.</li><li>Every Sunday: merge the week's notes into the subject cheat-sheet.</li></ul>
<h3>Useful plugins</h3><ul><li>Spaced Repetition: flashcards from your notes</li><li>Templater: auto-insert topic template</li><li>Dataview: list all <code>#weak</code> notes</li><li>Excalidraw: quick diagrams</li></ul></div></div>
<div class="card"><h3>Mistake Log format (most valuable note)</h3><pre>| Question | My answer | Correct | Reason (concept/silly/time) | Fix |</pre><p>Revisit the log every Sunday and again in January. Repeated mistakes are your fastest marks.</p></div>`}
const G=[()=>{let a=24+~~(Math.random()*60),b=12+~~(Math.random()*40),g=(x,y)=>y?g(y,x%y):x;return[`GCD of ${a} and ${b}?`,g(a,b)]},()=>{let n=5+~~(Math.random()*9);return[`Number of edges in a complete graph with ${n} vertices?`,n*(n-1)/2]},()=>{let h=3+~~(Math.random()*6);return[`Maximum nodes in a binary tree of height ${h} (root at height 0)?`,2**(h+1)-1]},()=>{let k=4+~~(Math.random()*3),n=20+~~(Math.random()*30);return[`A ${k}-stage pipeline executes ${n} instructions with no stalls. Total cycles?`,k+n-1]},()=>{let kb=2**(2+~~(Math.random()*5)),bl=2**(3+~~(Math.random()*3));return[`Direct-mapped cache of ${kb} KB with ${bl}-byte blocks. How many cache lines?`,kb*1024/bl]},()=>{let n=6+~~(Math.random()*5),k=2+~~(Math.random()*2);let c=1;for(let i=0;i<k;i++)c=c*(n-i)/(i+1);return[`Number of ways to choose ${k} items from ${n}?`,c]},()=>{let n=100+~~(Math.random()*900);return[`How many 1s are in the binary representation of ${n}?`,n.toString(2).split("1").length-1]},()=>{let p=[0.1,0.2,0.25,0.4][~~(Math.random()*4)],n=[10,20,50][~~(Math.random()*3)];return[`Binomial distribution: n=${n}, p=${p}. Mean?`,n*p]}];
let cq=G[0]();
function nat(){const[a,b]=S.nat;return `<div class="grid2"><div class="card"><h2>NAT drill</h2><p class="mu">Type the number only, no options to guess from. Score: ${a}/${b}</p><h3 id="nq" style="margin:14px 0">${cq[0]}</h3><div style="display:flex;gap:8px"><input type="text" id="na" inputmode="decimal" placeholder="Your numerical answer" onkeydown="if(event.key=='Enter')chk()"><button class="btn" onclick="chk()">Check</button></div><p id="nr" style="margin-top:10px"></p></div>
<div class="card"><h3>How to ace NAT questions</h3><ul><li>No options and no negative marking: always answer.</li><li>Use the virtual calculator; practise it daily.</li><li>Round only at the end; answers have a tolerance range.</li><li>Verify with a small case (n = 2 or 3).</li><li>High-yield NAT areas: probability/expectation, graph counts, cache and pipeline numericals, scheduling averages, page tables, subnetting, DP tables, CRC.</li><li>Do 10 NATs after every study day.</li></ul></div></div>`}
function chk(){const v=parseFloat($("#na").value);if(isNaN(v)){$("#nr").textContent="Enter a number first.";return}
const ok=Math.abs(v-cq[1])<.01;S.nat[1]++;if(ok)S.nat[0]++;save();$("#nr").innerHTML=ok?"✅ Correct!":`❌ Answer was <b>${cq[1]}</b>`;cq=G[~~(Math.random()*G.length)]();setTimeout(()=>{if(tab=="nat")render()},1400);head()}
let t=null,left=1500,run=false;const fmt=s=>String(~~(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tick(){left--;$("#clk").textContent=fmt(left);if(left%60==0){S.f++;save();$("#fm").textContent=Math.round(S.f/60*10)/10+" focus hrs logged"}if(left<=0){clearInterval(t);run=false;$("#st").textContent="Start focus (25 min)";left=1500;$("#clk").textContent="25:00";head();alert("Focus block done! Take a 5-minute break, then tick it off.")}}
function stt(m){if(run){clearInterval(t);run=false;$("#st").textContent="Start focus (25 min)";return}left=m*60;run=true;$("#st").textContent="Stop";t=setInterval(tick,1000)}
$("#st").onclick=()=>stt(25);$("#two").onclick=()=>{if(run)stt();left=300;run=true;$("#st").textContent="Stop";clearInterval(t);t=setInterval(tick,1000)};
function render(){head();$("#v").innerHTML=({today,plan,syl,notes,nat})[tab]()}
render();
</script></body></html>
